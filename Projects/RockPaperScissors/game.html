<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="game">
      <h1>Rock Paper Scissors</h1>
      <p class="subtitle">First to 5 points wins</p>

      <section class="scoreboard">
        <div class="score-box">
          <div class="label">You</div>
          <div class="value" id="human-score">0</div>
        </div>
        <div class="score-box">
          <div class="label">Computer</div>
          <div class="value" id="computer-score">0</div>
        </div>
      </section>

      <section class="choices">
        <button class="choice-btn" data-choice="rock" aria-label="rock">
          🪨
        </button>
        <button class="choice-btn" data-choice="paper" aria-label="paper">
          📄
        </button>
        <button class="choice-btn" data-choice="scissors" aria-label="scissors">
          ✂️
        </button>
      </section>

      <div class="result" id="result">
        <p class="headline">Pick a move to start</p>
      </div>

      <ul id="log"></ul>

      <button id="reset-btn" hidden>Play again</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
