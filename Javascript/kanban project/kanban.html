<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="kanban.css">
    <script src="./kanban.js" defer></script>
</head>
<body>
    <h1>Kanban Board</h1>
    <div class="board">
        
        <div class="column" id="todo-column">
            <h2>To Do</h2>
            <div class="card" id="card1">Fork and Clone microsoft/Web-Dev-For-Beginners repository</div>
            <div class="card" id="card2">Basics of HTML and CSS refresh</div>
            <div class="card" id="card3">Learn JavaScript basics</div>
            <div class="card" id="card4">Learn DOM manipulation</div>
            <div class="card" id="card5">Build calculator app on python</div>
            <div class="card" id="card6">Learn Fetch API and AJAX</div>
        </div>
        <div class="column" id="in-progress-column">
            <h2>In Progress</h2>
            <div class="card" id="card7">Card 3</div>
            <div class="card" id="card8">Card 4</div>
            <div class="card" id="card9">Card 5</div>
        </div>
        <div class="column" id="done-column">
            <h2>Done</h2>
            <div class="card" id="card10">Card 6</div>
        </div>
    </div>
</body>
</html>
